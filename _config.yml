# Site settings. Content lives in _data/*.yml (see README.md).
# GitHub Pages builds this site from the main branch with Jekyll 3.10.

title: Samira Korani
description: >-
  I help engineering teams evaluate RAG and agent systems, investigate
  unreliable outputs, and make better decisions about knowledge graphs and
  production AI.
url: "https://skorani.github.io"
baseurl: ""
lang: en-IE

markdown: kramdown
kramdown:
  input: GFM

# Consulting packages: one file each in _packages/, published at /services/<file-name>/
collections:
  packages:
    output: true
    permalink: /services/:name/

defaults:
  - scope:
      path: ""
      type: packages
    values:
      layout: package

# Not part of the published site
exclude:
  - README.md
  - private-notes
  - Gemfile
  - Gemfile.lock
  - vendor
  - review
  - brand-kit/brand-guidelines.md
  - brand-kit/preview.html
  - brand-kit/tools
  - tools
  - brand-kit/social/og-image.html
