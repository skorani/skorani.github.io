# The company that provides and invoices the consulting services.
# These are the only place the footer particulars come from.
#
# Leave a value as "" to keep it off the website. Never put placeholder text
# here: whatever you type is published exactly as written.

legal_name: MILEAWAY AI SYSTEMS LIMITED

# Fill these in once confirmed with your accountant.
