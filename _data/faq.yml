# Homepage FAQs. Answers are plain text; keep them short.
# [company] is replaced with legal_name from _data/company.yml, and [vat] with
# the VAT sentence from _includes/vat-note.html.

- q: What do you need from us for a Health Check?
  a: >-
    Access to the workflow in one agreed environment (often staging), a set of
    real or realistic questions or tasks, any examples of bad outputs you have
    already seen, and a technical contact who can answer questions during the
    week.

- q: Are 50 test cases enough?
  a: >-
    Enough to find systematic failures and decide what to fix first, if the
    cases are chosen well. Not enough to make statistical claims about
    production behaviour, and I won't present the results as if they were. The
    cases are yours to extend afterwards.

- q: Do you also fix what you find?
  a: >-
    The Health Check ends with prioritised fixes and a handover. If you'd like
    help implementing them, I'll scope that separately, so you can decide with
    the results in hand.

- q: Which stacks do you work with?
  a: >-
    I work mainly in Python, with Neo4j for knowledge graphs. The Health Check
    evaluates your workflow as it runs, so it doesn't depend on a particular
    framework or model provider.

- q: Do you work with teams outside Ireland?
  a: >-
    Yes. I work remotely with startups and mid-sized businesses anywhere.
    Calendly shows call times in your own time zone, and prices are in euro.

- q: How do you handle confidential data?
  a: >-
    Access, data handling and confidentiality terms are agreed in writing as
    part of the scope, before any work starts. I only ask for the access the
    agreed work needs.

- q: Who do we contract with?
  a: >-
    You work directly with me. Engagements are contracted with and invoiced by
    [company], the company through which I provide consulting
    services. [vat]
