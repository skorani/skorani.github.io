# Speaking and community. Only list things with a public source.

featured_talk:
  title: Building Contextual Knowledge Graphs to Adapt, Evaluate, and Leverage LLMs
  event: NODES 2025 (Neo4j)
  date: 2025-11-06
  summary: >-
    How I combined Geonames, OpenStreetMap, Yelp and Wikidata into contextual
    knowledge graphs that give LLMs real-world context, and used them to adapt
    and evaluate model output. The session was live-streamed from NODES 2025.
  url: https://www.youtube.com/watch?v=CNtyCgTDGDM
  link_label: Watch the session on YouTube
  event_url: https://neo4j.com/nodes-2025/

recognition:
  title: Neo4j Featured Community Member
  source: This Week in Neo4j
  date: 2025-11-08
  summary: >-
    Featured in Neo4j's weekly community round-up, which also highlighted my
    NODES 2025 session.
  url: https://neo4j.com/blog/twin4j/this-week-in-neo4j-nodes-retriever-graph-analytics-agents-and-more/
  link_label: Read the feature on neo4j.com

# Proposed talk and workshop topics (review before publishing widely).
topics:
  - title: Finding where your RAG system fails
    text: Building evaluation cases from real usage, checking groundedness, and turning failures into a prioritised fix list.
  - title: Graph, vector or hybrid?
    text: A practical way to decide when GraphRAG earns its complexity, and when better chunking or metadata would do more.
  - title: Contextual knowledge graphs for grounding LLMs
    text: Combining open datasets into a graph that gives models real-world context, building on my NODES 2025 session.
  - title: Observability for LLM applications
    text: Tracing, latency and cost, and catching regressions before users do.

workshops:
  - title: LLM evaluation for engineering teams
    text: A hands-on session in Python on building a small evaluation set and harness for a sample RAG application.
  - title: Knowledge graphs and GraphRAG with Neo4j
    text: A practical introduction to modelling, loading and querying a graph for retrieval.

