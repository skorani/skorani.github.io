<!doctype html>
<!-- Source for og-image.png (1200 x 630). Edit, then run brand-kit/tools/generate_assets.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Samira Korani social image</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--color-ivory);
    font-family: var(--font-sans);
    color: var(--color-ink);
    position: relative;
  }
  .net { position: absolute; right: 0; top: 0; }
  .content { position: absolute; left: 96px; top: 96px; right: 420px; bottom: 80px; display: flex; flex-direction: column; }
  .symbol { width: 84px; height: 84px; }
  h1 {
    margin: auto 0 0;
    font-size: 96px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .descriptor {
    margin: 26px 0 0;
    font-size: 34px;
    color: var(--color-slate);
    letter-spacing: 0.005em;
    white-space: nowrap;
  }
  .rule { width: 72px; height: 4px; background: var(--color-teal); margin-top: 44px; }
  .url { margin-top: 18px; font-size: 24px; color: var(--color-slate); }
</style>
</head>
<body>
  <!-- Decorative graph: pale sage, one teal node echoing the symbol. -->
  <svg class="net" width="460" height="630" viewBox="0 0 460 630" aria-hidden="true">
    <g stroke="#D8DFDA" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="150" y1="110" x2="300" y2="190"/>
      <line x1="300" y1="190" x2="400" y2="80"/>
      <line x1="300" y1="190" x2="250" y2="340"/>
      <line x1="250" y1="340" x2="120" y2="420"/>
      <line x1="250" y1="340" x2="390" y2="410"/>
      <line x1="390" y1="410" x2="330" y2="545"/>
      <line x1="120" y1="420" x2="180" y2="560"/>
      <line x1="390" y1="410" x2="470" y2="300"/>
      <line x1="400" y1="80" x2="470" y2="150"/>
    </g>
    <g fill="#D8DFDA">
      <circle cx="150" cy="110" r="11"/>
      <circle cx="400" cy="80" r="9"/>
      <circle cx="120" cy="420" r="10"/>
      <circle cx="390" cy="410" r="13"/>
      <circle cx="330" cy="545" r="9"/>
      <circle cx="180" cy="560" r="8"/>
      <circle cx="300" cy="190" r="13"/>
    </g>
    <circle cx="250" cy="340" r="16" fill="#075E54"/>
  </svg>

  <div class="content">
    <svg class="symbol" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="none" stroke="#075E54" stroke-width="2.6" stroke-linecap="round">
        <line x1="9.75" y1="6" x2="9.75" y2="26"/><line x1="9.75" y1="16" x2="22.25" y2="6"/><line x1="9.75" y1="16" x2="22.25" y2="26"/>
      </g>
      <g fill="#075E54">
        <circle cx="9.75" cy="6" r="3"/><circle cx="9.75" cy="26" r="3"/><circle cx="22.25" cy="6" r="3"/><circle cx="22.25" cy="26" r="3"/><circle cx="9.75" cy="16" r="3.6"/>
      </g>
    </svg>
    <h1>Samira Korani</h1>
    <p class="descriptor">Knowledge Graphs · GraphRAG · LLM Evaluation</p>
    <div class="rule"></div>
    <p class="url">skorani.github.io</p>
  </div>
</body>
</html>
